services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Falta MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: pps14
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Falta APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username app --password "$$APP_DB_PASSWORD" --authenticationDatabase pps14 --eval "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  mongo_data:
